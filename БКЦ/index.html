<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Образный код 1–1000</title>
  <style>
    :root[data-theme="dark"] {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --bg-input: #090d16;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --success: #22c55e;
      --danger: #ef4444;
    }

    :root[data-theme="light"] {
      --bg-main: #f1f5f9;
      --bg-card: #ffffff;
      --bg-hover: #e2e8f0;
      --bg-input: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --border: #cbd5e1;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.5;
      padding: 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 10px;
      z-index: 100;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--accent);
    }

    .badge {
      background: var(--bg-input);
      color: var(--text-muted);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      flex: 1;
      justify-content: flex-end;
    }

    .search-input {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.95rem;
      min-width: 240px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent);
    }

    button, .btn-label {
      background-color: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      user-select: none;
    }

    button:hover, .btn-label:hover {
      background-color: var(--bg-hover);
      border-color: var(--accent);
    }

    .btn-primary {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      min-width: 90px;
      justify-content: center;
      font-weight: 500;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 10px;
    }

    .cell {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s, transform 0.1s;
    }

    .cell:focus-within {
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    .num {
      font-weight: 700;
      color: var(--accent);
      min-width: 38px;
      font-size: 0.95rem;
      user-select: none;
    }

    .word-input {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .word-input:focus {
      background-color: var(--bg-input);
    }

    #fileInput {
      display: none;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: var(--bg-card);
      border: 1px solid var(--accent);
      color: var(--text-main);
      padding: 12px 20px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.25s;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

const STORAGE_KEY = 'mnemonic_words_1000_v1';
const THEME_KEY = 'dom_cheat_theme';

let wordsData = {};
let activeRange = [1, 100];

// Загрузка данных
function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      wordsData = JSON.parse(saved);
      return;
    } catch (e) {
      console.error(e);
    }
  }
  resetToDefault(false);
}

function resetToDefault(notify = true) {
  wordsData = {};
  rawWords.forEach((word, index) => {
    wordsData[index + 1] = word;
  });
  saveData(notify);
}

function saveData(notify = true) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(wordsData));
  if (notify) showToast('Изменения сохранены');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// Вкладки сотен
function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = `tab-btn ${activeRange[0] === 1 && activeRange[1] === 1000 ? 'active' : ''}`;
  allBtn.textContent = 'Все (1–1000)';
  allBtn.onclick = () => { activeRange = [1, 1000]; renderTabs(); renderGrid(); };
  container.appendChild(allBtn);

  for (let i = 0; i < 10; i++) {
    const start = i * 100 + 1;
    const end = (i + 1) * 100;
    const btn = document.createElement('button');
    btn.className = `tab-btn ${activeRange[0] === start && activeRange[1] === end ? 'active' : ''}`;
    btn.textContent = `${start}–${end}`;
    btn.onclick = () => {
      activeRange = [start, end];
      renderTabs();
      renderGrid();
    };
    container.appendChild(btn);
  }
}

// Отрисовка сетки
function renderGrid() {
  const container = document.getElementById('gridContainer');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  container.innerHTML = '';

  const fragment = document.createDocumentFragment();

  for (let i = 1; i <= 1000; i++) {
    const word = wordsData[i] || '';
    if (query) {
      const matchNum = String(i).includes(query);
      const matchWord = word.toLowerCase().includes(query);
      if (!matchNum && !matchWord) continue;
    } else {
      if (i < activeRange[0] || i > activeRange[1]) continue;
    }

    const cell = document.createElement('div');
    cell.className = 'cell';

    const numSpan = document.createElement('span');
    numSpan.className = 'num';
    numSpan.textContent = i + '.';

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'word-input';
    input.value = word;
    input.dataset.id = i;

    input.addEventListener('change', (e) => {
      const id = e.target.dataset.id;
      wordsData[id] = e.target.value.trim();
      saveData(true);
    });

    cell.appendChild(numSpan);
    cell.appendChild(input);
    fragment.appendChild(cell);
  }

  container.appendChild(fragment);
}

// Экспорт в JSON
document.getElementById('exportBtn').addEventListener('click', () => {
  const dataStr = JSON.stringify(wordsData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mnemonic-1-1000.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('Файл JSON скачан');
});

// Импорт из JSON
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (typeof imported === 'object' && imported !== null) {
        wordsData = imported;
        saveData(false);
        renderGrid();
        showToast('Список успешно импортирован!');
      }
    } catch (err) {
      alert('Ошибка чтения JSON файла');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Сброс
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Сбросить все изменения к начальному списку 1–1000?')) {
    resetToDefault(true);
    renderGrid();
  }
});

// Поиск
document.getElementById('searchInput').addEventListener('input', renderGrid);

// Переключение темы
const themeBtn = document.getElementById('themeBtn');
const savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
document.documentElement.setAttribute('data-theme', savedTheme);

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem(THEME_KEY, next);
});

// Старт
loadData();
renderTabs();
renderGrid();
</script>
