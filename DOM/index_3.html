<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База знаний: Skillbox, Обучение, Linux, Windows</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #070b19 0%, #0f1e3d 50%, #050811 100%);
      --card-bg: rgba(18, 27, 48, 0.85);
      --sidebar-bg: rgba(10, 15, 30, 0.95);
      --card-border: rgba(219, 39, 119, 0.3);
      --pink-shadow: 0 14px 30px -5px rgba(157, 23, 77, 0.55), 
                     0 4px 15px -2px rgba(219, 39, 119, 0.3);
      --pink-shadow-hover: 0 20px 40px -5px rgba(190, 24, 93, 0.75), 
                           0 8px 20px -2px rgba(236, 72, 153, 0.45);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 40px 24px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* ================= БУРГЕР-КНОПКА И БОКОВОЕ МЕНЮ ================= */
    .burger-btn {
      position: fixed;
      top: 24px;
      left: 24px;
      z-index: 1001;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(236, 72, 153, 0.5);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      box-shadow: 0 4px 20px rgba(157, 23, 77, 0.5);
      backdrop-filter: blur(8px);
      transition: all 0.2s ease;
    }

    .burger-btn:hover {
      border-color: #f472b6;
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(236, 72, 153, 0.7);
    }

    .burger-icon {
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 18px;
    }

    .burger-icon span {
      display: block;
      height: 2px;
      width: 100%;
      background: #f472b6;
      border-radius: 2px;
      transition: 0.3s;
    }

    /* Затемнение фона при открытии меню */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 14, 0.65);
      backdrop-filter: blur(4px);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    .overlay.open {
      opacity: 1;
      visibility: visible;
    }

    /* Боковая панель (Главные главы) */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 290px;
      background: var(--sidebar-bg);
      border-right: 1px solid rgba(236, 72, 153, 0.35);
      box-shadow: 10px 0 35px rgba(157, 23, 77, 0.45);
      z-index: 1000;
      padding: 85px 20px 30px;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow-y: auto;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .sidebar-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--text-muted);
      margin: 10px 8px 4px;
    }

    .chapter-btn {
      background: rgba(18, 27, 48, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.98rem;
      font-weight: 500;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chapter-btn:hover {
      border-color: rgba(244, 114, 182, 0.5);
      background: rgba(30, 41, 69, 0.9);
      transform: translateX(4px);
    }

    .chapter-btn.active {
      background: linear-gradient(135deg, #be185d, #4f46e5);
      border-color: #f472b6;
      color: #fff;
      font-weight: 600;
      box-shadow: 0 6px 18px rgba(219, 39, 119, 0.45);
    }

    /* ================= ШАПКА И ВКЛАДКИ ================= */
    header {
      max-width: 1200px;
      margin: 0 auto 36px;
      text-align: center;
    }

    .current-chapter-label {
      display: inline-block;
      font-size: 0.85rem;
      color: #f472b6;
      background: rgba(219, 39, 119, 0.15);
      border: 1px solid rgba(236, 72, 153, 0.35);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #60a5fa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .controls {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .tab-btn {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(219, 39, 119, 0.35);
      color: var(--text-main);
      padding: 9px 20px;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      border-color: #f472b6;
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #be185d, #7e22ce);
      border-color: #f472b6;
      color: #ffffff;
      box-shadow: 0 6px 20px rgba(219, 39, 119, 0.6);
    }

    .search-box {
      width: 100%;
      max-width: 480px;
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid rgba(219, 39, 119, 0.4);
      background: rgba(6, 9, 19, 0.85);
      color: #f8fafc;
      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(157, 23, 77, 0.25);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box:focus {
      border-color: #ec4899;
      box-shadow: 0 4px 20px rgba(236, 72, 153, 0.5);
    }

    /* ================= СЕТКА И КАРТОЧКИ ================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: var(--pink-shadow);
      backdrop-filter: blur(10px);
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card:hover {
      transform: translateY(-7px);
      box-shadow: var(--pink-shadow-hover);
      border-color: rgba(236, 72, 153, 0.65);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 1.12rem;
      font-weight: 600;
      color: #f8fafc;
    }

    .badge {
      font-size: 0.72rem;
      padding: 3px 10px;
      border-radius: 20px;
      background: rgba(157, 23, 77, 0.35);
      border: 1px solid rgba(236, 72, 153, 0.4);
      color: #fbcfe8;
      white-space: nowrap;
    }

    .code-box {
      background: #060913;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: 'Fira Code', 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      overflow-x: auto;
      cursor: pointer;
      position: relative;
      transition: border-color 0.2s;
    }

    .code-box:hover {
      border-color: #ec4899;
    }

    .code-box::after {
      content: 'Копировать';
      position: absolute;
      top: 6px;
      right: 8px;
      font-size: 0.7rem;
      background: rgba(219, 39, 119, 0.2);
      color: #f472b6;
      padding: 2px 6px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .code-box:hover::after {
      opacity: 1;
    }

    .code-box.copied::after {
      content: 'Скопировано!';
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      opacity: 1;
    }

    /* Подсветка синтаксиса */
    .syn-obj { color: #38bdf8; }
    .syn-method { color: #f472b6; }
    .syn-str { color: #a3e635; }
    .syn-kw { color: #c084fc; }

    .card-desc {
      font-size: 0.92rem;
      color: #cbd5e1;
    }

    /* Классы маркеров и цвета текста */
    .m-pink {
      background: rgba(219, 39, 119, 0.35);
      color: #fce7f3;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .m-blue {
      background: rgba(37, 99, 235, 0.4);
      color: #dbeafe;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .m-yellow {
      background: rgba(202, 138, 4, 0.35);
      color: #fef08a;
      padding: 1px 6px;
      border-radius: 4px;
    }
    .t-pink { color: #f472b6; font-weight: 600; }
    .t-cyan { color: #38bdf8; font-weight: 600; }
    .t-green { color: #4ade80; font-weight: 600; }
  </style>
</head>
<body>

  <!-- Кнопка открытия бургер-меню -->
  <button class="burger-btn" id="burgerBtn">
    <div class="burger-icon">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <span>Главы</span>
  </button>

  <!-- Затемнение фона -->
  <div class="overlay" id="overlay"></div>

  <!-- Боковое меню (Главные главы) -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-title">Все материалы</div>
    <button class="chapter-btn active" data-chapter="all">Все главы</button>

    <div class="sidebar-title">Разработка</div>
    <button class="chapter-btn" data-chapter="Skillbox">Skillbox</button>
    <button class="chapter-btn" data-chapter="Моё обучение">Моё обучение</button>

    <div class="sidebar-title">Системы и Сервер</div>
    <button class="chapter-btn" data-chapter="Linux">Linux</button>
    <button class="chapter-btn" data-chapter="Windows">Windows</button>
  </aside>

  <header>
    <div class="current-chapter-label" id="currentChapterBadge">Глава: Все главы</div>
    <h1>Интерактивная база знаний</h1>
    <p>Нажмите на блок с кодом, чтобы скопировать команду</p>

    <div class="controls">
      <!-- Верхние вкладки генерируются автоматически под выбранную главу -->
      <div class="tabs" id="tabsContainer"></div>

      <input type="text" id="searchInput" class="search-box" placeholder="Поиск по командам и описанию...">
    </div>
  </header>

  <main class="grid" id="cardsGrid"></main>

  <script>
    const cardsData = [
      // ================= ГЛАВА: SKILLBOX =================
      {
        chapter: 'Skillbox',
        section: 'DOM',
        title: 'Поиск одного элемента',
        category: 'Skillbox • DOM',
        codeHtml: `<span class="syn-kw">const</span> el = <span class="syn-obj">document</span>.<span class="syn-method">querySelector</span>(<span class="syn-str">'.class'</span>);`,
        rawCode: `const el = document.querySelector('.class');`,
        desc: `Возвращает <span class="m-pink">первый найденный элемент</span> по CSS-селектору. Если не найден — вернет <span class="t-pink">null</span>.`
      },
      {
        chapter: 'Skillbox',
        section: 'DOM',
        title: 'Слушатель событий',
        category: 'Skillbox • События',
        codeHtml: `<span class="syn-obj">btn</span>.<span class="syn-method">addEventListener</span>(<span class="syn-str">'click'</span>, (e) => {\n  <span class="syn-obj">e</span>.<span class="syn-method">preventDefault</span>();\n});`,
        rawCode: `btn.addEventListener('click', (e) => {\n  e.preventDefault();\n});`,
        desc: `Вешает обработчик события. <span class="m-yellow">e.preventDefault()</span> отменяет стандартное поведение браузера.`
      },
      {
        chapter: 'Skillbox',
        section: 'Массивы',
        title: 'Фильтрация массива (filter)',
        category: 'Skillbox • Массивы',
        codeHtml: `<span class="syn-kw">const</span> active = <span class="syn-obj">users</span>.<span class="syn-method">filter</span>(u => u.isOnline);`,
        rawCode: `const active = users.filter(u => u.isOnline);`,
        desc: `Создает <span class="m-blue">новый массив</span> со всеми элементами, прошедшими проверку в функции.`
      },

      // ================= ГЛАВА: МОЁ ОБУЧЕНИЕ =================
      {
        chapter: 'Моё обучение',
        section: 'Vue',
        title: 'Реактивная переменная (ref)',
        category: 'Обучение • Vue 3',
        codeHtml: `<span class="syn-kw">const</span> count = <span class="syn-method">ref</span>(<span class="syn-str">0</span>);\ncount.<span class="syn-obj">value</span>++;`,
        rawCode: `const count = ref(0);\ncount.value++;`,
        desc: `Создает реактивную ссылку. В скрипте меняем через <span class="m-pink">.value</span>, в шаблоне <span class="t-cyan">&lt;template&gt;</span> пишем без него.`
      },
      {
        chapter: 'Моё обучение',
        section: 'DOM',
        title: 'Делегирование событий (closest)',
        category: 'Обучение • Практика',
        codeHtml: `<span class="syn-kw">const</span> card = <span class="syn-obj">e</span>.target.<span class="syn-method">closest</span>(<span class="syn-str">'.card'</span>);`,
        rawCode: `const card = e.target.closest('.card');`,
        desc: `Ищет ближайшего родителя по селектору. Незаменимо для <span class="m-yellow">кликов по динамическим карточкам</span>.`
      },

      // ================= ГЛАВА: LINUX =================
      {
        chapter: 'Linux',
        section: 'Терминал',
        title: 'Права на выполнение скрипта',
        category: 'Linux • Bash',
        codeHtml: `<span class="syn-method">chmod</span> +x <span class="syn-str">script.sh</span>`,
        rawCode: `chmod +x script.sh`,
        desc: `Делает файл исполняемым, чтобы его можно было запустить напрямую через <span class="t-green">./script.sh</span>.`
      },
      {
        chapter: 'Linux',
        section: 'Docker',
        title: 'Просмотр логов контейнера',
        category: 'Linux • Docker',
        codeHtml: `<span class="syn-obj">docker</span> <span class="syn-method">logs</span> -f <span class="syn-str">container_name</span>`,
        rawCode: `docker logs -f container_name`,
        desc: `Выводит логи работы контейнера. Флаг <span class="m-pink">-f</span> оставляет поток открытым в реальном времени.`
      },

      // ================= ГЛАВА: WINDOWS =================
      {
        chapter: 'Windows',
        section: 'Сеть и Консоль',
        title: 'Очистка DNS-кэша и сеть',
        category: 'Windows • CMD',
        codeHtml: `<span class="syn-obj">ipconfig</span> <span class="syn-method">/flushdns</span>\n<span class="syn-obj">netstat</span> <span class="syn-method">-ano</span> | findstr <span class="syn-str">:8080</span>`,
        rawCode: `ipconfig /flushdns\nnetstat -ano | findstr :8080`,
        desc: `Первая команда сбрасывает DNS, вторая ищет <span class="m-blue">PID процесса</span>, который занял нужный порт.`
      }
    ];

    const grid = document.getElementById('cardsGrid');
    const searchInput = document.getElementById('searchInput');
    const tabsContainer = document.getElementById('tabsContainer');
    const sidebar = document.getElementById('sidebar');
    const burgerBtn = document.getElementById('burgerBtn');
    const overlay = document.getElementById('overlay');
    const currentChapterBadge = document.getElementById('currentChapterBadge');

    let currentChapter = 'all';
    let currentSection = 'all';

    // Открытие и закрытие бургер-меню
    function toggleMenu() {
      sidebar.classList.toggle('open');
      overlay.classList.toggle('open');
    }

    burgerBtn.addEventListener('click', toggleMenu);
    overlay.addEventListener('click', toggleMenu);

    // Отрисовка всех карточек в DOM
    cardsData.forEach(item => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.chapter = item.chapter;
      card.dataset.section = item.section;
      card.innerHTML = `
        <div class="card-header">
          <h2 class="card-title">${item.title}</h2>
          <span class="badge">${item.category}</span>
        </div>
        <pre class="code-box" data-code="${item.rawCode.replace(/"/g, '&quot;')}"><code>${item.codeHtml}</code></pre>
        <p class="card-desc">${item.desc}</p>
      `;
      grid.append(card);
    });

    // Генерация верхних вкладок (табов) под выбранную главу
    function renderTopTabs() {
      const relevantCards = currentChapter === 'all'
        ? cardsData
        : cardsData.filter(c => c.chapter === currentChapter);

      // Собираем уникальные разделы (section) внутри текущей главы
      const sections = ['all', ...new Set(relevantCards.map(c => c.section))];

      tabsContainer.innerHTML = '';
      sections.forEach(sec => {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${sec === currentSection ? 'active' : ''}`;
        btn.dataset.section = sec;
        btn.textContent = sec === 'all' ? 'Все разделы' : sec;
        tabsContainer.append(btn);
      });
    }

    // Фильтрация карточек по Главе + Вкладке + Поиску
    function filterCards() {
      const query = searchInput.value.toLowerCase();
      const allCards = document.querySelectorAll('.card');

      allCards.forEach(card => {
        const matchesChapter = currentChapter === 'all' || card.dataset.chapter === currentChapter;
        const matchesSection = currentSection === 'all' || card.dataset.section === currentSection;
        const matchesSearch = card.textContent.toLowerCase().includes(query);

        card.style.display = (matchesChapter && matchesSection && matchesSearch) ? 'flex' : 'none';
      });
    }

    // Выбор главы в боковом меню
    sidebar.addEventListener('click', (e) => {
      const btn = e.target.closest('.chapter-btn');
      if (!btn) return;

      document.querySelectorAll('.chapter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentChapter = btn.dataset.chapter;
      currentSection = 'all'; // Сбрасываем подкатегорию при смене главы
      currentChapterBadge.textContent = `Глава: ${btn.textContent}`;

      renderTopTabs();
      filterCards();
      toggleMenu(); // Закрываем меню после выбора
    });

    // Переключение верхних вкладок
    tabsContainer.addEventListener('click', (e) => {
      const btn = e.target.closest('.tab-btn');
      if (!btn) return;

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      currentSection = btn.dataset.section;
      filterCards();
    });

    // Живой поиск
    searchInput.addEventListener('input', filterCards);

    // Копирование кода по клику
    grid.addEventListener('click', (e) => {
      const codeBox = e.target.closest('.code-box');
      if (!codeBox) return;

      navigator.clipboard.writeText(codeBox.dataset.code);
      codeBox.classList.add('copied');
      setTimeout(() => codeBox.classList.remove('copied'), 1200);
    });

    // Инициализация вкладок при первом запуске
    renderTopTabs();
  </script>
  <!-- 
  
  Как добавлять новые разделы:
В блоке <div class="tabs" id="tabsContainer"> добавьте новую кнопку, например:

HTML
<button class="tab-btn" data-section="Linux">Linux / Docker</button>
В массиве cardsData создайте карточку со свойством section: 'Linux'. Фильтрация подхватит её автоматически.

  
  Как устроена логика: 
  Двухуровневая фильтрация: 
  У каждой карточки в cardsData теперь есть поле chapter (отвечает за кнопку в левом бургер-меню) и поле section (отвечает за верхние вкладки).
  Умные верхние вкладки: 
  Вам больше не нужно прописывать верхние кнопки вручную в HTML. 
  Функция renderTopTabs() сама смотрит, какие разделы (section) есть внутри выбранной главы, и рисует только нужные вкладки. 
  
  Например, при выборе Linux сверху появятся только кнопки Все разделы, Терминал и Docker.
  
  Как добавить новую главу в бургер-меню: 
  В блоке <aside class="sidebar"> скопируйте любую кнопку <button class="chapter-btn" data-chapter="Имя_Главы">Имя_Главы</button> и укажите это же имя в поле chapter у новых карточек. -->
</body>
</html>
