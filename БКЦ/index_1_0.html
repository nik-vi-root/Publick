<!DOCTYPE html>
<html lang="ru" data-theme="male">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Образный код 1–1000 (RU / EN / Транскрипция)</title>
  <style>
    :root[data-theme="male"] {
      --bg-gradient: linear-gradient(135deg, #040914 0%, #0a192f 45%, #0f3156 100%);
      --panel-bg: rgba(15, 29, 54, 0.85);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.45);
      --accent-btn: linear-gradient(135deg, #0284c7, #2563eb);
      --border-color: rgba(56, 189, 248, 0.28);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    :root[data-theme="female"] {
      --bg-gradient: linear-gradient(135deg, #160516 0%, #380936 45%, #2b0f4c 100%);
      --panel-bg: rgba(45, 12, 48, 0.85);
      --accent: #f472b6;
      --accent-glow: rgba(244, 114, 182, 0.45);
      --accent-btn: linear-gradient(135deg, #db2777, #9333ea);
      --border-color: rgba(244, 114, 182, 0.3);
      --text-main: #fdf2f8;
      --text-muted: #f9a8d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px;
      line-height: 1.4;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
    }

    header {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 18px 22px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 12px;
      z-index: 100;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.65), 0 0 20px var(--accent-glow);
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.35rem;
      color: var(--text-main);
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8), 0 0 12px var(--accent-glow);
      letter-spacing: 0.4px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .search-input {
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.95rem;
      min-width: 240px;
      outline: none;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.3);
    }

    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    button, .btn-label {
      background: rgba(0, 0, 0, 0.45);
      color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.45);
      user-select: none;
    }

    button:hover, .btn-label:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6), 0 0 12px var(--accent-glow);
    }

    .btn-primary {
      background: var(--accent-btn);
      border-color: transparent;
      font-weight: 600;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      min-width: 92px;
      justify-content: center;
    }

    .tab-btn.active {
      background: var(--accent-btn);
      border-color: #ffffff;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6), 0 0 15px var(--accent-glow);
      transform: translateY(-2px);
    }

    .list-header {
      display: grid;
      grid-template-columns: 78px 1.2fr 1fr 1fr;
      gap: 12px;
      padding: 0 16px 10px 16px;
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      text-shadow: 0 2px 5px rgba(0,0,0,0.8);
      text-align: center;
    }

    .rows-container {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Парящая строка-карточка */
    .word-row {
      display: flex;
      justify-content: space-around;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.65), 0 4px 10px rgba(0, 0, 0, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      align-items: center;
    }

    .word-row:hover {
      transform: translateY(-4px) scale(1.004);
      border-color: rgba(255, 255, 255, 0.42);
      box-shadow: 0 20px 38px rgba(0, 0, 0, 0.8), 0 0 18px var(--accent-glow);
    }

    /* Парящая ячейка внутри строки */
    .floating-cell {
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.42);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55), inset 0 1px 1px rgba(255, 255, 255, 0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .floating-cell:hover, .floating-cell:focus-within {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 12px 22px rgba(0, 0, 0, 0.75), 0 0 10px var(--accent-glow);
    }

    .num-cell {
      justify-content: center;
      font-weight: 800;
      font-size: 1.05rem;
      color: #ffffff;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.85);
      user-select: none;
      position: relative;
    }

    .cell-input {
    text-align: center;
      background: transparent;
      border: none;
      color: inherit;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      outline: none;
      text-shadow: 0 3px 6px rgba(0, 0, 0, 0.75);
      letter-spacing: 0.2px;
    }

    .cell-color-tools {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      opacity: 0.35;
      transition: opacity 0.15s;
    }

    .floating-cell:hover .cell-color-tools,
    .floating-cell:focus-within .cell-color-tools {
      opacity: 1;
    }

    .color-picker-wrap {
      width: 20px;
      height: 20px;
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.45);
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0,0,0,0.5);
    }

    .color-picker-wrap input[type="color"] {
      width: 32px;
      height: 32px;
      opacity: 0;
      cursor: pointer;
    }

    #fileInput {
      display: none;
    }

    .toast {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.7), 0 0 15px var(--accent-glow);
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 860px) {
      .list-header { display: none; }
      .word-row {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="title-group">
      <h1>Образный код 1–1000</h1>
      <button id="themeBtn" class="btn-primary">👔 Женская тема</button>
    </div>
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск (№, слово, перевод)...">
      <button id="exportBtn" class="btn-primary">⬇ Экспорт JSON</button>
      <label for="fileInput" class="btn-label">⬆ Импорт JSON</label>
      <input type="file" id="fileInput" accept=".json">
      <button id="resetBtn" title="Сбросить все правки и цвета">↺ Сброс</button>
    </div>
  </header>

  <div class="tabs" id="tabsContainer"></div>

    <div>Перевод (EN)</div>
    <div>Транскрипция</div>

  <div class="rows-container" id="rowsContainer"></div>
</div>

<div class="toast" id="toast">Сохранено</div>

// Палитра контрастных темных оттенков для строк (отлично читается белый текст)
const rowPalette = [
  "#111827", "#1e1b4b", "#31102f", "#0f292a", "#2e1065",
  "#172554", "#3b0764", "#062e22", "#3f1320", "#1f2438",
  "#27173a", "#0c2536", "#331812", "#14291b", "#2d1233"
];

const STORAGE_KEY = 'mnemonic_1000_floating_v2';
const THEME_KEY = 'mnemonic_gender_theme';

let wordsData = {};
let activeRange = [1, 100];

function getDefaultRowColor(idx) {
  return rowPalette[(idx - 1) % rowPalette.length];
}

function buildDefaultData() {
  const data = {};
  rawItems.forEach((entry, index) => {
    const id = index + 1;
    const [ru, en, tr] = entry.split('|');
    data[id] = {
      ru: ru || '',
      en: en || '',
      tr: tr || '',
      rowBg: getDefaultRowColor(id),
      styles: {
        num: { bg: '#090d16', color: '#ffffff' },
        ru:  { bg: '#090d16', color: '#ffffff' },
        en:  { bg: '#090d16', color: '#38bdf8' },
        tr:  { bg: '#090d16', color: '#cbd5e1' }
      }
    };
  });
  return data;
}

function loadData() {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed[1] && typeof parsed[1] === 'object') {
        wordsData = parsed;
        return;
      }
    } catch (e) {
      console.error(e);
    }
  }
  wordsData = buildDefaultData();
  saveData(false);
}

function saveData(notify = true) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(wordsData));
  if (notify) showToast('Изменения сохранены');
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => toast.classList.remove('show'), 1700);
}

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = '';

  const allBtn = document.createElement('button');
  allBtn.className = `tab-btn ${activeRange[0] === 1 && activeRange[1] === 1000 ? 'active' : ''}`;
  allBtn.textContent = 'Все (1–1000)';
  allBtn.onclick = () => { activeRange = [1, 1000]; renderTabs(); renderRows(); };
  container.appendChild(allBtn);

  for (let i = 0; i < 10; i++) {
    const start = i * 100 + 1;
    const end = (i + 1) * 100;
    const btn = document.createElement('button');
    btn.className = `tab-btn ${activeRange[0] === start && activeRange[1] === end ? 'active' : ''}`;
    btn.textContent = `${start}–${end}`;
    btn.onclick = () => {
      activeRange = [start, end];
      renderTabs();
      renderRows();
    };
    container.appendChild(btn);
  }
}

function createEditableCell(id, fieldKey, valueText) {
  const item = wordsData[id];
  const cellStyle = item.styles[fieldKey] || { bg: '#090d16', color: '#ffffff' };

  const cell = document.createElement('div');
  cell.className = 'floating-cell';
  cell.style.backgroundColor = cellStyle.bg;
  cell.style.color = cellStyle.color;

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input';
  input.value = valueText;
  input.addEventListener('change', (e) => {
    wordsData[id][fieldKey] = e.target.value.trim();
    saveData(true);
  });

  const tools = document.createElement('div');
  tools.className = 'cell-color-tools';

  // Выбор цвета фона ячейки
  const bgWrap = document.createElement('label');
  bgWrap.className = 'color-picker-wrap';
  bgWrap.title = 'Цвет фона ячейки';
  bgWrap.style.backgroundColor = cellStyle.bg;
  bgWrap.textContent = 'Ф';
  const bgInput = document.createElement('input');
  bgInput.type = 'color';
  bgInput.value = cellStyle.bg;
  bgInput.addEventListener('input', (e) => {
    const val = e.target.value;
    cell.style.backgroundColor = val;
    bgWrap.style.backgroundColor = val;
    wordsData[id].styles[fieldKey].bg = val;
    saveData(false);
  });
  bgWrap.appendChild(bgInput);

  // Выбор цвета текста ячейки
  const txtWrap = document.createElement('label');
  txtWrap.className = 'color-picker-wrap';
  txtWrap.title = 'Цвет текста ячейки';
  txtWrap.style.backgroundColor = '#1e293b';
  txtWrap.style.color = cellStyle.color;
  txtWrap.textContent = 'Т';
  const txtInput = document.createElement('input');
  txtInput.type = 'color';
  txtInput.value = cellStyle.color;
  txtInput.addEventListener('input', (e) => {
    const val = e.target.value;
    cell.style.color = val;
    txtWrap.style.color = val;
    wordsData[id].styles[fieldKey].color = val;
    saveData(false);
  });
  txtWrap.appendChild(txtInput);

  tools.appendChild(bgWrap);
  tools.appendChild(txtWrap);

  cell.appendChild(input);
  cell.appendChild(tools);
  return cell;
}

function renderRows() {
  const container = document.getElementById('rowsContainer');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  container.innerHTML = '';

  const fragment = document.createDocumentFragment();

  for (let i = 1; i <= 1000; i++) {
    const item = wordsData[i];
    if (!item) continue;

    if (query) {
      const matchNum = String(i).includes(query);
      const matchRu = item.ru.toLowerCase().includes(query);
      const matchEn = item.en.toLowerCase().includes(query);
      if (!matchNum && !matchRu && !matchEn) continue;
    } else {
      if (i < activeRange[0] || i > activeRange[1]) continue;
    }

    const row = document.createElement('div');
    row.className = 'word-row';
    row.style.backgroundColor = item.rowBg || getDefaultRowColor(i);

    // Ячейка номера + выбор фона всей строки и самой ячейки номера
    const numCell = document.createElement('div');
    numCell.className = 'floating-cell num-cell';
    const numStyle = item.styles?.num || { bg: '#090d16', color: '#ffffff' };
    numCell.style.backgroundColor = numStyle.bg;
    numCell.style.color = numStyle.color;

    const numText = document.createElement('span');
    numText.textContent = i;

    const rowTools = document.createElement('div');
    rowTools.className = 'cell-color-tools';

    const rowBgWrap = document.createElement('label');
    rowBgWrap.className = 'color-picker-wrap';
    rowBgWrap.title = 'Цвет фона всей строки';
    rowBgWrap.style.backgroundColor = item.rowBg;
    rowBgWrap.textContent = 'С';
    const rowBgInput = document.createElement('input');
    rowBgInput.type = 'color';
    rowBgInput.value = item.rowBg;
    rowBgInput.addEventListener('input', (e) => {
      const val = e.target.value;
      row.style.backgroundColor = val;
      rowBgWrap.style.backgroundColor = val;
      wordsData[i].rowBg = val;
      saveData(false);
    });
    rowBgWrap.appendChild(rowBgInput);

    const numTxtWrap = document.createElement('label');
    numTxtWrap.className = 'color-picker-wrap';
    numTxtWrap.title = 'Цвет цифры';
    numTxtWrap.style.color = numStyle.color;
    numTxtWrap.textContent = '№';
    const numTxtInput = document.createElement('input');
    numTxtInput.type = 'color';
    numTxtInput.value = numStyle.color;
    numTxtInput.addEventListener('input', (e) => {
      const val = e.target.value;
      numCell.style.color = val;
      numTxtWrap.style.color = val;
      wordsData[i].styles.num.color = val;
      saveData(false);
    });
    numTxtWrap.appendChild(numTxtInput);

    rowTools.appendChild(rowBgWrap);
    rowTools.appendChild(numTxtWrap);
    numCell.appendChild(numText);
    numCell.appendChild(rowTools);

    // Ячейки: Русское слово, Английский перевод, Транскрипция
    const ruCell = createEditableCell(i, 'ru', item.ru);
    const enCell = createEditableCell(i, 'en', item.en);
    const trCell = createEditableCell(i, 'tr', item.tr);

    row.appendChild(numCell);
    row.appendChild(ruCell);
    row.appendChild(enCell);
    row.appendChild(trCell);

    fragment.appendChild(row);
  }

  container.appendChild(fragment);
}

// Экспорт в JSON
document.getElementById('exportBtn').addEventListener('click', () => {
  const dataStr = JSON.stringify(wordsData, null, 2);
  const blob = new Blob([dataStr], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'mnemonic-1-1000-ru-en.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('JSON файл сохранен');
});

// Импорт из JSON
document.getElementById('fileInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    try {
      const imported = JSON.parse(event.target.result);
      if (typeof imported === 'object' && imported !== null) {
        wordsData = imported;
        saveData(false);
        renderRows();
        showToast('Список и цвета успешно импортированы!');
      }
    } catch (err) {
      alert('Ошибка чтения JSON файла');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Сброс к исходному состоянию
document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Сбросить все изменения и цвета к базовому списку 1–1000?')) {
    wordsData = buildDefaultData();
    saveData(true);
    renderRows();
  }
});

// Поиск
document.getElementById('searchInput').addEventListener('input', renderRows);

// Переключение Мужской / Женской темы
const themeBtn = document.getElementById('themeBtn');
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  themeBtn.textContent = theme === 'male' ? '🌸 Женская тема' : '👔 Мужская тема';
  localStorage.setItem(THEME_KEY, theme);
}

const savedTheme = localStorage.getItem(THEME_KEY) || 'male';
applyTheme(savedTheme);

themeBtn.addEventListener('click', () => {
  const current = document.documentElement.getAttribute('data-theme');
  applyTheme(current === 'male' ? 'female' : 'male');
});

// Инициализация
loadData();
renderTabs();
renderRows();
</script>

</body>
</html>
